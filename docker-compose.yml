x-infinex-service: &infinex-service
  image: ghcr.io/imbingox/infinex:latest
  build:
    context: .
  restart: unless-stopped

x-infinex-environment: &infinex-environment
  ARTIFACT_DIR: /app/data/artifacts
  WORKER_DATA_DIR: /app/data/workers
  WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-change-me-before-production}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: infinex
      POSTGRES_USER: infinex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinex}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinex -d infinex"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  infinex:
    <<: *infinex-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *infinex-environment
      DATABASE_URL: postgresql+psycopg://infinex:${POSTGRES_PASSWORD:-infinex}@postgres:5432/infinex
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - infinex-data:/app/data

  backtest-worker:
    <<: *infinex-service
    profiles: ["workers"]
    command:
      [
        "infinex",
        "backtest-worker",
        "--worker-id",
        "backtest-compose",
        "--control-plane-url",
        "http://infinex:8002",
      ]
    depends_on:
      infinex:
        condition: service_healthy
    environment:
      <<: *infinex-environment
    volumes:
      - worker-data:/app/data/workers

  live-agent:
    <<: *infinex-service
    profiles: ["workers"]
    command:
      [
        "infinex",
        "live-agent",
        "--worker-id",
        "live-compose",
        "--control-plane-url",
        "http://infinex:8002",
      ]
    depends_on:
      infinex:
        condition: service_healthy
    environment:
      <<: *infinex-environment
    volumes:
      - worker-data:/app/data/workers

volumes:
  infinex-data:
  postgres-data:
  worker-data:
