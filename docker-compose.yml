x-infinex-service: &infinex-service
  image: ${INFINEX_IMAGE:-ghcr.io/imbingox/infinex:latest}
  build:
    context: .
  restart: unless-stopped

x-worker-environment: &worker-environment
  WORKER_DATA_DIR: /app/data/workers
  WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-change-me-before-production}

services:
  infinex:
    <<: *infinex-service
    environment:
      <<: *worker-environment
      ARTIFACT_DIR: /app/data/artifacts
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/infinex.db}
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - type: bind
        source: ${INFINEX_DATA_ROOT:-./data}/control-plane
        target: /app/data
        bind:
          create_host_path: false

  backtest-worker:
    <<: *infinex-service
    command:
      [
        "infinex",
        "backtest-worker",
        "--worker-id",
        "${BACKTEST_WORKER_ID:-backtest-compose}",
        "--control-plane-url",
        "http://infinex:8002",
      ]
    depends_on:
      infinex:
        condition: service_healthy
    environment:
      <<: *worker-environment
    volumes:
      - type: bind
        source: ${INFINEX_DATA_ROOT:-./data}/backtest-worker
        target: /app/data/workers
        bind:
          create_host_path: false
