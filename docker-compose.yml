x-infinex-service: &infinex-service
  image: ${INFINEX_IMAGE:-ghcr.io/imbingox/infinex:latest}
  build: .
  user: "0:0"
  restart: unless-stopped

services:
  infinex:
    <<: *infinex-service
    env_file:
      - path: ${INFINEX_ENV_FILE:-.env.control-plane}
        required: false
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data/control-plane:/app/data

  backtest-worker:
    <<: *infinex-service
    command: ["infinex", "backtest-worker"]
    depends_on:
      infinex:
        condition: service_healthy
    env_file:
      - path: ${INFINEX_ENV_FILE:-.env.control-plane}
        required: false
    environment:
      CONTROL_PLANE_URL: http://infinex:8002
    volumes:
      - ./data/backtest-worker:/app/data/workers
