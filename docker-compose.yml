x-infinex-service: &infinex-service
  image: ${INFINEX_IMAGE:-ghcr.io/imbingox/infinex:latest}
  build: .
  user: "0:0"
  restart: unless-stopped

services:
  infinex:
    <<: *infinex-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/infinex.db}
      INFINEX_PORT: ${INFINEX_PORT:-8002}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-development-enrollment-token}
    ports:
      - "${INFINEX_PORT:-8002}:${INFINEX_PORT:-8002}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${INFINEX_PORT:-8002}/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data/control-plane:/app/data

  backtest-worker:
    <<: *infinex-service
    command: ["infinex", "backtest-worker"]
    depends_on:
      infinex:
        condition: service_healthy
    environment:
      CONTROL_PLANE_URL: http://infinex:${INFINEX_PORT:-8002}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-development-enrollment-token}
      WORKER_ID: ${WORKER_ID:-backtest-compose}
    volumes:
      - ./data/backtest-worker:/app/data/workers
