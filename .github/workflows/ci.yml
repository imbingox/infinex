name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infinex_test
          POSTGRES_USER: infinex
          POSTGRES_PASSWORD: infinex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinex -d infinex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://infinex:infinex@127.0.0.1:5432/infinex_test
      WORKER_ENROLLMENT_TOKEN: ci-enrollment-token

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install backend
        run: uv sync --extra dev --frozen

      - name: Backend checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Install web
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Web checks
        working-directory: web
        run: |
          bun run typecheck
          bun test
          bun run build

      - name: Container smoke test
        run: |
          docker build --tag infinex:ci .
          container_id="$(
            docker run \
              --detach \
              --publish 127.0.0.1:18002:8002 \
              infinex:ci
          )"

          cleanup() {
            docker rm --force "$container_id" >/dev/null
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18002/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:18002/ \
            | grep --fixed-strings '<div id="root"></div>'
