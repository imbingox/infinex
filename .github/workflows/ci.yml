name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infinex_test
          POSTGRES_USER: infinex
          POSTGRES_PASSWORD: infinex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinex -d infinex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://infinex:infinex@127.0.0.1:5432/infinex_test
      WORKER_ENROLLMENT_TOKEN: ci-enrollment-token

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend
        run: uv sync --extra dev --frozen

      - name: Backend checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Install web
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Web checks
        working-directory: web
        run: |
          bun run typecheck
          bun test
          bun run build
