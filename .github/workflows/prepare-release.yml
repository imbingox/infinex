name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump override
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: false

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate release commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        run: |
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }

          before_sha="$(git rev-parse HEAD)"
          release_args=(version --no-push --no-tag --no-vcs-release)

          case "${{ inputs.release_type }}" in
            auto)
              ;;
            patch)
              release_args+=(--patch)
              ;;
            minor)
              release_args+=(--minor)
              ;;
            major)
              release_args+=(--major)
              ;;
            *)
              echo "Unsupported release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

          env -u GITHUB_OUTPUT \
            uvx --from python-semantic-release==10.6.1 \
            semantic-release "${release_args[@]}"

          after_sha="$(git rev-parse HEAD)"
          if [ "$before_sha" = "$after_sha" ]; then
            echo "No release commit was generated."
            write_output "released=false"
            exit 0
          fi

          version="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          tag="v${version}"
          branch="release/${tag}"

          write_output \
            "released=true" \
            "version=${version}" \
            "tag=${tag}" \
            "branch=${branch}"

      - name: Push release branch
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git branch --force "$RELEASE_BRANCH" HEAD
          git fetch origin \
            "$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH" || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "$RELEASE_BRANCH"

      - name: Open release PR
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          existing_pr="$(
            gh pr list \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // ""'
          )"
          if [ -n "$existing_pr" ]; then
            echo "Release PR already exists: $existing_pr"
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-pr-body.md" <<'PR_BODY'
          Generated by the Prepare Release workflow.

          This PR updates the project version and changelog. After it is squash merged and CI passes on main, the Publish Release workflow will create the GitHub Release and GHCR image.
          PR_BODY

          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file "$RUNNER_TEMP/release-pr-body.md"

      - name: Run CI for release branch
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"
