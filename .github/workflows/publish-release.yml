name: Publish Release

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: false

      - name: Determine release version
        id: release
        run: |
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }

          version="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          tag="v${version}"

          release_commit_found=false
          candidate_commits=(HEAD)
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            candidate_commits+=(HEAD^2)
          fi

          for candidate in "${candidate_commits[@]}"; do
            commit_message="$(git log -1 --pretty=%B "$candidate")"
            if grep -Eq "^chore\\(release\\): ${tag}([[:space:]]|$)" \
              <<< "$commit_message"; then
              release_commit_found=true
              break
            fi
          done

          if [ "$release_commit_found" != "true" ]; then
            echo "No candidate commit message matches release ${tag}; skipping publish."
            write_output "should_publish=false"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists; skipping publish."
            write_output "should_publish=false"
            exit 0
          fi

          write_output \
            "should_publish=true" \
            "version=${version}" \
            "tag=${tag}" \
            "sha=$(git rev-parse HEAD)"

      - name: Set up Docker Buildx
        if: steps.release.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        if: steps.release.outputs.should_publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.release.outputs.should_publish == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/imbingox/infinex
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.release.outputs.should_publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
