services:
  live-agent:
    image: ${INFINEX_IMAGE:-ghcr.io/imbingox/infinex:latest}
    user: "0:0"
    restart: unless-stopped
    command: ["infinex", "live-agent"]
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?set CONTROL_PLANE_URL in .env}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:?set WORKER_ENROLLMENT_TOKEN in .env}
      WORKER_ID: ${WORKER_ID:?set WORKER_ID in .env}
    volumes:
      - ./data/live-worker:/app/data/workers
