services:
  live-agent:
    image: ${INFINEX_IMAGE:-ghcr.io/imbingox/infinex:latest}
    restart: unless-stopped
    command:
      [
        "infinex",
        "live-agent",
        "--worker-id",
        "${LIVE_WORKER_ID:?set LIVE_WORKER_ID to a stable unique identifier}",
        "--control-plane-url",
        "${CONTROL_PLANE_URL:?set CONTROL_PLANE_URL to the reachable Control Plane URL}",
      ]
    environment:
      WORKER_DATA_DIR: /app/data/workers
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-change-me-before-production}
    volumes:
      - type: bind
        source: ${INFINEX_DATA_ROOT:-./data}/live-worker
        target: /app/data/workers
        bind:
          create_host_path: false
