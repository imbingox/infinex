services:
  live-agent:
    image: ${INFINEX_IMAGE:-ghcr.io/imbingox/infinex:latest}
    user: "0:0"
    restart: unless-stopped
    command: ["infinex", "live-agent"]
    env_file:
      - path: ${INFINEX_ENV_FILE:-.env.live-worker}
        required: true
    volumes:
      - ./data/live-worker:/app/data/workers
