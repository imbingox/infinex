[project]
name = "infinex"
version = "0.1.0"
description = "NautilusTrader-oriented trading control plane MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "jsonschema>=4.24.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "python-socketio[client]>=5.13.0",
    "python-multipart>=0.0.20",
    "rich>=14.0.0",
    "sqlmodel>=0.0.24",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
infinex = "infinex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: requires TEST_POSTGRES_URL pointing to a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
